name: Deploy public website to Fasthosts

# Repository variables keep deployment disabled until the Fasthosts account is ready.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.html
      - privacy.html
      - terms.html
      - technical.html
      - signin.html
      - install.html
      - downloads/**
      - .github/workflows/deploy-fasthosts.yml

permissions:
  contents: read

concurrency:
  group: binky-public-website
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.FASTHOSTS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the approved website
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Upload the static pages using encrypted FTP
        env:
          FTP_SERVER: ${{ vars.FASTHOSTS_FTP_SERVER || 'ftp.fasthosts.co.uk' }}
          FTP_DIRECTORY: ${{ vars.FASTHOSTS_FTP_DIRECTORY || '/htdocs/' }}
          FTP_USERNAME: ${{ secrets.FASTHOSTS_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FASTHOSTS_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_USERNAME:?Add the FASTHOSTS_FTP_USERNAME repository secret}"
          : "${FTP_PASSWORD:?Add the FASTHOSTS_FTP_PASSWORD repository secret}"
          case "$FTP_DIRECTORY" in
            */) ;;
            *) FTP_DIRECTORY="${FTP_DIRECTORY}/" ;;
          esac
          for page in index.html privacy.html terms.html technical.html signin.html install.html downloads/Binky-Connect-0.3.8.apk downloads/Binky-Connect-0.3.8.apk.sha256; do
            curl --fail --silent --show-error --ftp-ssl-reqd \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              --ftp-create-dirs --upload-file "$page" \
              "ftp://${FTP_SERVER}${FTP_DIRECTORY}${page}"
          done

      - name: Confirm the public website
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "https://binky-ai.co.uk/?deployment=${GITHUB_SHA}" \
            | grep -F "A little help. A clearer day."
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "https://binky-ai.co.uk/privacy.html?deployment=${GITHUB_SHA}" \
            | grep -F "Privacy Policy"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "https://binky-ai.co.uk/terms.html?deployment=${GITHUB_SHA}" \
            | grep -F "Terms of Service"

          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "https://binky-ai.co.uk/technical.html?deployment=${GITHUB_SHA}" \
            | grep -F "A closer look at Binky"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "https://binky-ai.co.uk/signin.html?deployment=${GITHUB_SHA}" \
            | grep -F "Sign in to Binky"

          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "https://binky-ai.co.uk/install.html?deployment=${GITHUB_SHA}" \
            | grep -F "Download Binky Connect for Android"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "https://binky-ai.co.uk/downloads/Binky-Connect-0.3.8.apk?deployment=${GITHUB_SHA}" \
            --output /tmp/binky-connect-download.apk
          EXPECTED_APK_SHA=$(cut -d ' ' -f 1 downloads/Binky-Connect-0.3.8.apk.sha256)
          ACTUAL_APK_SHA=$(sha256sum /tmp/binky-connect-download.apk | cut -d ' ' -f 1)
          test "$ACTUAL_APK_SHA" = "$EXPECTED_APK_SHA"
